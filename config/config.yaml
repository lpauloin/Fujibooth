app:
  window_title: FujiBooth
  fullscreen: false
  countdown_seconds: 3
  freeze_seconds: 8

camera:
  usb:
    enabled: true
    vendor_id: "04cb"
    product_ids: ["02e6"]
    camera_name_contains: "FUJIFILM"
  sdk:
    sdk_root: "./sdk"
    library_path: ""
    live_view_interval_ms: 120

storage:
  captures_dir: "./runtime/captures"
  output_dir: "./runtime/output"
  thumbnails_dir: "./runtime/thumbnails"
  accepted_extensions: [".jpg", ".jpeg", ".png", ".raf", ".heic"]
  filename_pattern: "%Y%m%d_%H%M%S"
  frame_path: "./config/frame.png"

printing:
  enabled: true
  monitor_enabled: true
  scan_interval_ms: 15000
  scan_duration_ms: 1500
  lost_after_misses: 3
  initial_grace_ms: 10000
  cooldown_after_busy_ms: 30000
  mode: "instax_ble"          # auto | instax_ble | command | stub
  command: ""           # e.g. lp -d MyPrinter, or use {path}
  device_name: ""       # e.g. INSTAX-12345678, optional
  device_address: ""    # e.g. FA:AB:BC:xx:xx:xx, optional
  wait_after_print_seconds: 60
  max_queue_size: 3
  auto_rotate_landscape: true
  image_fit: "cover"          # cover = crop portrait plein cadre, contain = bandes blanches
  autocontrast: true
  color_boost: 1.25
  contrast_boost: 1.15
  brightness_boost: 1.05
  sharpness_boost: 1.05

remote:
  enabled: true
  hid_device_name: "Beauty-R1"   # paired as BLE keyboard (Minor Type: Keyboard)
  hid_vendor_id: 0x0E05           # Beauty-R1 VID — run app once to see [HID-ENUM] if wrong
  hid_product_id: 0x0A00          # Beauty-R1 PID

ui:
  background_color: "#111111"
  status_connected_color: "#16a34a"
  status_disconnected_color: "#dc2626"
  thumbnail_width: 220
  thumbnail_height: 146
  bottom_gallery_height: 210
